    <!-- Dynamic Multilingual Title -->
    <script>
      const titles = [
        "Pathana Shakthi",
        "पठन शक्ति",
        "పఠన శక్తి"
      ];

      let titleIndex = 0;

      setInterval(() => {
        titleIndex = (titleIndex + 1) % titles.length;
        document.title = titles[titleIndex];
      }, 10000);
    </script>

  </body>
